<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>CA²pp · Login</title>
  <style>
    /* ———— classic reset & base ———— */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-wrap: wrap;
      width: 100vw;
      min-height: 100vh;
      height: 100%;
      background-color: #161731;    /* deep navy */
      color: #f0f2f5;
      font-family: 'Garamond', 'Times New Roman', 'Georgia', serif;
      line-height: 1.5;
    }

    /* ———— left panel: brand & message (classic elegance) ———— */
    .holder {
      flex: 1 1 50%;
      min-height: 40vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2.5rem 2rem;
      text-align: center;
      background: #161731;
      border-right: 1px solid rgba(255, 255, 255, 0.04);
    }

    .holder h3 {
      font-size: clamp(3.2rem, 10vw, 5.6rem);
      font-weight: 400;
      letter-spacing: 0.06em;
      font-family: 'Garamond', 'Times New Roman', serif;
      margin-bottom: 0.3rem;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      word-break: break-word;
    }

    .holder h3 span {
      color: #b0c7e7;        /* classic sky-blue, muted & refined */
      font-weight: 400;
      letter-spacing: 0.08em;
    }

    .holder p {
      font-size: clamp(1rem, 2.6vw, 1.5rem);
      font-family: 'Garamond', 'Times New Roman', serif;
      font-style: italic;
      opacity: 0.8;
      max-width: 32ch;
      margin-top: 0.4rem;
      color: #cfd8e8;
      letter-spacing: 0.04em;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 0.8rem;
    }

    /* ———— right panel: classic form card ———— */
    .form {
      flex: 1 1 50%;
      min-height: 50vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2.8rem 2.2rem;
      background: #1e1f3a;        /* classic dark slate */
      backdrop-filter: blur(2px);
      border-radius: 0;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      gap: 1.4rem;
      width: 100%;
      transition: all 0.2s;
    }

    /* classic form elements: understated, refined */
    .form input,
    .form button {
      width: 100%;
      max-width: 380px;
      padding: 0.85rem 1.4rem;
      font-size: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 40px;          /* soft but classic */
      background: rgba(255, 255, 255, 0.04);
      color: #f0f2f5;
      font-family: 'Garamond', 'Times New Roman', serif;
      transition: border-color 0.25s, background 0.2s, box-shadow 0.2s;
      letter-spacing: 0.04em;
      outline: none;
    }

    .form input::placeholder {
      color: #8f9bb5;
      opacity: 0.7;
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.02em;
    }

    .form input:focus {
      border-color: #b0c7e7;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 0 3px rgba(176, 199, 231, 0.15);
    }

    .form input {
      margin-bottom: 0.1rem;
    }

    .form button {
      background: #b0c7e7;          /* classic sky-blue, muted */
      color: #161731;
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
      border: 1px solid #b0c7e7;
      padding: 0.85rem 1.4rem;
      margin-top: 0.3rem;
      transition: background 0.2s, border-color 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(176, 199, 231, 0.15);
      letter-spacing: 0.08em;
      font-family: 'Garamond', 'Times New Roman', serif;
      text-transform: uppercase;
      font-size: 0.95rem;
      border-radius: 40px;
    }

    .form button:hover {
      background: #c2d6f0;
      border-color: #c2d6f0;
      box-shadow: 0 6px 18px rgba(176, 199, 231, 0.3);
      transform: scale(1.01);
    }

    .form button:active {
      transform: scale(0.97);
    }

    .form a {
      color: #a6b7d9;
      text-decoration: none;
      font-size: 1rem;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s, color 0.2s;
      margin-top: 0.2rem;
      font-family: 'Garamond', 'Times New Roman', serif;
      letter-spacing: 0.06em;
      font-style: italic;
    }

    .form a:hover {
      color: #c2d6f0;
      border-bottom: 1px solid #b0c7e7;
    }

    /* ———— responsive: classic stacking ———— */

    @media (max-width: 820px) {
      body {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
      }

      .holder {
        flex: 0 0 auto;
        width: 100%;
        min-height: 28vh;
        padding: 2.2rem 1.8rem 1.2rem;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }

      .holder h3 {
        font-size: clamp(3.4rem, 14vw, 5rem);
      }

      .holder p {
        font-size: 1.1rem;
      }

      .form {
        flex: 0 0 auto;
        width: 100%;
        min-height: 50vh;
        border-radius: 36px 36px 0 0;
        padding: 2.5rem 1.8rem 3rem;
        background: #1e1f3a;
        box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.5);
        gap: 1.2rem;
      }

      .form input,
      .form button {
        max-width: 420px;
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .holder {
        padding: 1.8rem 1rem 0.8rem;
        min-height: 22vh;
      }

      .holder h3 {
        font-size: clamp(2.8rem, 16vw, 3.8rem);
      }

      .holder p {
        font-size: 0.95rem;
        padding-top: 0.4rem;
        margin-top: 0.2rem;
      }

      .form {
        padding: 2rem 1.2rem 2.6rem;
        gap: 1rem;
        border-radius: 28px 28px 0 0;
      }

      .form input,
      .form button {
        padding: 0.75rem 1rem;
        font-size: 0.95rem;
        border-radius: 40px;
      }

      .form button {
        font-size: 0.9rem;
        padding: 0.8rem 1rem;
      }

      .form a {
        font-size: 0.9rem;
      }
    }

    @media (max-width: 360px) {
      .holder h3 {
        font-size: 2.4rem;
      }
      .form input,
      .form button {
        max-width: 100%;
      }
    }

    /* landscape on phones: keep compact & classic */
    @media (max-height: 600px) and (orientation: landscape) {
      body {
        flex-direction: row;
        flex-wrap: nowrap;
        height: 100vh;
        min-height: 100vh;
      }

      .holder {
        flex: 1 1 38%;
        min-height: 100vh;
        padding: 1.5rem 1.2rem;
        border-right: 1px solid rgba(255, 255, 255, 0.04);
        border-bottom: none;
      }

      .holder h3 {
        font-size: clamp(2.2rem, 5vw, 3.4rem);
      }

      .holder p {
        font-size: 0.85rem;
        max-width: 20ch;
      }

      .form {
        flex: 1 1 62%;
        min-height: 100vh;
        border-radius: 0;
        padding: 1.8rem 1.5rem;
        justify-content: center;
        background: #1e1f3a;
        box-shadow: none;
      }

      .form input,
      .form button {
        max-width: 280px;
        padding: 0.6rem 0.9rem;
        font-size: 0.85rem;
      }
    }

    @media (min-width: 1400px) {
      .holder h3 {
        font-size: 5.8rem;
      }
      .form input,
      .form button {
        max-width: 440px;
        padding: 1rem 1.8rem;
        font-size: 1.1rem;
      }
      .form {
        padding: 3.5rem;
      }
    }

    /* reduce motion if preferred */
    @media (prefers-reduced-motion: reduce) {
      .form button {
        transition: none;
      }
      .form button:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>

  <!-- left panel: classic brand & tagline -->
  <div class="holder">
    <h3><span>CA²</span>pp</h3>
    <p>A Bridge to distance with loved ones</p>
  </div>

  <!-- right panel: classic login form -->
  <form class="form" method="post">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Username or email" aria-label="Username">
    <input type="password" name="password" placeholder="Password" aria-label="Password">
    <button type="submit">Login</button>
    <a href="{% url 'signup' %}">signup</a>
  </form>

</body>
</html>
