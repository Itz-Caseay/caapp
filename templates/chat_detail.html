<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat - BayaPlus</title>
    <!-- ... styles ... -->
    <style>
        /* Prevent body scrolling when keyboard is open */
        body {
            height: 100%;
            overflow: hidden;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; /* For modern mobile browsers */
            max-height: -webkit-fill-available;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 80px; /* Space for input */
        }
        .chat-input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f0f0f;
            border-top: 1px solid #1a1a1a;
            padding: 12px 16px;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 50;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .chat-input-area input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            padding: 10px 16px;
            color: white;
            font-size: 16px; /* Prevents iOS zoom */
            outline: none;
        }
        .chat-input-area input:focus {
            border-color: #fbbf24;
        }
        .chat-input-area button {
            background: #fbbf24;
            color: black;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .chat-input-area button:hover {
            background: #f59e0b;
        }
        .chat-input-area button:active {
            transform: scale(0.95);
        }
        
        /* On mobile, adjust padding */
        @media (max-width: 640px) {
            .chat-input-area {
                padding: 8px 12px;
                padding-bottom: calc(8px + env(safe-area-inset-bottom));
            }
            .chat-input-area input {
                font-size: 16px;
                padding: 8px 14px;
            }
            .chat-input-area button {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <header class="bg-[#0f0f0f] border-b border-[#1a1a1a] px-4 py-3 flex items-center gap-3 shrink-0">
            <a href="{% url 'fanboard' %}" class="text-gray-400 hover:text-white">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-red-950 flex items-center justify-center text-sm font-bold">
                    {{ recipient.username|first|upper }}
                </div>
                <div>
                    <h2 class="font-bold text-sm">{{ recipient.fullname|default:recipient.username }}</h2>
                    <p class="text-xs text-gray-500">Online</p>
                </div>
            </div>
        </header>

        <!-- Messages -->
        <div class="chat-messages" id="chatMessages">
            <!-- Messages loop -->
            {% for message in messages %}
                <div class="flex {% if message.sender == user %}justify-end{% else %}justify-start{% endif %} mb-3">
                    <div class="max-w-[75%] p-3 rounded-lg {% if message.sender == user %}bg-yellow-400 text-black{% else %}bg-[#1a1a1a] text-white{% endif %}">
                        <p class="text-sm">{{ message.content }}</p>
                        <p class="text-[10px] text-gray-500 mt-1">{{ message.created_at|time:"H:i" }}</p>
                    </div>
                </div>
            {% endfor %}
        </div>

        <!-- Input Area -->
        <div class="chat-input-area" id="chatInputArea">
            <input type="text" id="messageInput" placeholder="Type a message..." 
                   autocomplete="off" autocorrect="off" spellcheck="true"
                   inputmode="text" enterkeyhint="send">
            <button id="sendBtn">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        // ============================================
        // CHAT FUNCTIONALITY WITH KEYBOARD FIX
        // ============================================
        const input = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesContainer = document.getElementById('chatMessages');

        // Focus input on load (for desktop)
        // On mobile, focus only on tap
        input.addEventListener('focus', function() {
            // Scroll input into view
            setTimeout(() => {
                this.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 300);
        });

        // Send message function
        function sendMessage() {
            const content = input.value.trim();
            if (!content) return;

            // Append message to UI (optimistic)
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex justify-end mb-3';
            messageDiv.innerHTML = `
                <div class="max-w-[75%] p-3 rounded-lg bg-yellow-400 text-black">
                    <p class="text-sm">${content}</p>
                    <p class="text-[10px] text-gray-700 mt-1">Just now</p>
                </div>
            `;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Clear input
            input.value = '';

            // Send to server via AJAX
            fetch('/bayaplus/chat/send/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCSRFToken(),
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    recipient_id: {{ recipient.id }},
                    content: content
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Update message time
                }
            })
            .catch(error => console.error('Error sending message:', error));

            // Keep focus on input after send
            input.focus();
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // Function to get CSRF token
        function getCSRFToken() {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    const trimmed = cookie.trim();
                    if (trimmed.startsWith('csrftoken=')) {
                        cookieValue = decodeURIComponent(trimmed.substring(10));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Scroll to bottom on load
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        // On mobile, ensure input is not hidden by keyboard
        // Use VisualViewport API to adjust
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', function() {
                const inputArea = document.getElementById('chatInputArea');
                if (window.visualViewport.height < window.innerHeight) {
                    // Keyboard open
                    inputArea.style.position = 'sticky';
                    inputArea.style.bottom = '0';
                } else {
                    // Keyboard closed
                    inputArea.style.position = 'fixed';
                    inputArea.style.bottom = '0';
                }
            });
        }
    </script>
</body>
</html>
