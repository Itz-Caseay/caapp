{% extends 'base.html' %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<div style="width:100%;height:100vh;display:flex;align-items:center;justify-content:center;background:#0b141a;">
    <div style="background:#1f2c33;border-radius:16px;padding:48px;max-width:420px;width:90%;max-height:90vh;overflow-y:auto;">
        <div style="text-align:center;margin-bottom:24px;">
            <h1 style="font-size:28px;font-weight:700;color:#e9edef;">
                <span style="color:#00a884;">CA²</span>pp
            </h1>
            <p style="color:#6a7b83;margin-top:4px;font-size:14px;">Create your account</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            {% if messages %}
                {% for message in messages %}
                    <div style="background:rgba(255,59,48,0.1);border:1px solid rgba(255,59,48,0.2);color:#ff3b30;padding:10px 16px;border-radius:8px;margin-bottom:16px;font-size:14px;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            
            <div style="margin-bottom:12px;">
                <input type="text" name="username" placeholder="Username" required style="width:100%;background:#2a3942;border:none;border-radius:8px;padding:12px 16px;color:#e9edef;font-size:14px;outline:none;font-family:'Inter',sans-serif;">
            </div>
            <div style="margin-bottom:12px;">
                <input type="text" name="fullname" placeholder="Full Name" required style="width:100%;background:#2a3942;border:none;border-radius:8px;padding:12px 16px;color:#e9edef;font-size:14px;outline:none;font-family:'Inter',sans-serif;">
            </div>
            <div style="margin-bottom:12px;">
                <input type="email" name="email" placeholder="Email" required style="width:100%;background:#2a3942;border:none;border-radius:8px;padding:12px 16px;color:#e9edef;font-size:14px;outline:none;font-family:'Inter',sans-serif;">
            </div>
            <div style="margin-bottom:12px;">
                <input type="password" name="password" placeholder="Password" required style="width:100%;background:#2a3942;border:none;border-radius:8px;padding:12px 16px;color:#e9edef;font-size:14px;outline:none;font-family:'Inter',sans-serif;">
            </div>
            <div style="margin-bottom:20px;">
                <input type="password" name="password2" placeholder="Confirm Password" required style="width:100%;background:#2a3942;border:none;border-radius:8px;padding:12px 16px;color:#e9edef;font-size:14px;outline:none;font-family:'Inter',sans-serif;">
            </div>
            
            <button type="submit" style="width:100%;background:#00a884;border:none;border-radius:8px;padding:12px;color:#0b141a;font-weight:600;font-size:16px;cursor:pointer;transition:background 0.2s;font-family:'Inter',sans-serif;">
                Sign Up
            </button>
        </form>
        
        <div style="text-align:center;margin-top:20px;color:#6a7b83;font-size:14px;">
            Already have an account? <a href="{% url 'login' %}" style="color:#00a884;text-decoration:none;font-weight:500;">Login</a>
        </div>
    </div>
</div>
{% endblock %}
